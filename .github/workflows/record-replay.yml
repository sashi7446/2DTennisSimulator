name: Record Matchups

# Run it from the GitHub mobile app: Actions -> Record Matchups -> Run workflow.
#
# Agent names are free text on purpose: a newly written agent works here as
# soon as create_agent() knows about it, with no change to this file.

on:
  workflow_dispatch:
    inputs:
      agents:
        description: "Agents to pair up, space separated"
        required: true
        default: "chase smart baseliner positional intercept solver random"
      points:
        description: "Points per card"
        required: true
        default: "10"
      force:
        description: "Re-record cards that already exist"
        type: boolean
        default: false

permissions:
  contents: write

# One recording at a time, so two runs cannot race on docs/replays
concurrency:
  group: record-replay
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Record the matchups
        env:
          AGENTS: ${{ inputs.agents }}
          POINTS: ${{ inputs.points }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          args=(--points "$POINTS" --agents $AGENTS)
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python record_matrix.py "${args[@]}" | tee recording.log

      - name: Publish to the viewer
        run: |
          set -euo pipefail
          if git diff --quiet docs/ && [ -z "$(git status --porcelain docs/)" ]; then
            echo "Every card is already published - nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "Record agent matchups"
          # A run started while someone was pushing would otherwise just fail
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase
            sleep $((attempt * 2))
          done
          git push

      - name: Summary
        if: always()
        run: |
          {
            echo "## Matchups"
            echo ""
            echo '```'
            cat recording.log 2>/dev/null || echo "(recording failed)"
            echo '```'
            echo ""
            echo "Reload the viewer once Pages redeploys (about a minute)."
          } >> "$GITHUB_STEP_SUMMARY"
