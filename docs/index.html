<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161c">
<title>2D Tennis Simulator - Replay</title>
<style>
  :root {
    --bg: #12161c;
    --panel: #1b212b;
    --line: #2b3442;
    --text: #e8edf4;
    --dim: #8a97a8;
    --a: #ff5b5b;
    --b: #4d8bff;
    --ball: #ffe14d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", sans-serif;
    max-width: 720px;
    margin-inline: auto;
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 2px; color: var(--dim); }
  .meta { font-size: 12px; color: var(--dim); opacity: .7; margin-bottom: 10px; min-height: 18px; }
  .score {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    font-variant-numeric: tabular-nums; margin-bottom: 10px;
  }
  .score .name { font-size: 13px; color: var(--dim); }
  .score .num { font-size: 30px; font-weight: 700; line-height: 1; }
  .score .a .num { color: var(--a); }
  .score .b .num { color: var(--b); }
  .score .sep { color: var(--dim); font-size: 22px; }
  .side { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 92px; }
  canvas { width: 100%; display: block; border-radius: 10px; background: var(--panel); }
  .hud {
    display: flex; justify-content: space-between; align-items: center;
    margin: 10px 2px; font-size: 13px; color: var(--dim);
    font-variant-numeric: tabular-nums; min-height: 22px;
  }
  .badge {
    color: #ffca4d; font-weight: 600;
    opacity: 0; transition: opacity .2s;
  }
  .badge.on { opacity: 1; }
  .controls { display: flex; gap: 8px; }
  button {
    flex: 1; min-height: 46px; padding: 0 10px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    font-size: 15px; font-family: inherit; cursor: pointer;
  }
  button:active { background: #252d3a; }
  #play { flex: 1.4; font-weight: 600; }
  #auto.on { border-color: #3d9d6b; color: #7fd6a5; }

  /* matchup grid - the whole card list at a glance, one tap per card */
  .gridwrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 12px; }
  .grid { display: grid; gap: 3px; min-width: max-content; }
  .grid .hd {
    font-size: 10px; color: var(--dim); text-align: center;
    display: flex; align-items: center; justify-content: center;
    letter-spacing: .04em;
  }
  .grid .hd.row { justify-content: flex-end; padding-right: 5px; }
  .grid .cell {
    min-width: 38px; min-height: 34px; padding: 0;
    font-size: 11px; border-radius: 7px; flex: none;
    background: #202836; border-color: transparent; color: var(--dim);
  }
  .grid .cell.has { background: #2f7d55; color: #eaf6ee; }
  .grid .cell.on { outline: 2px solid #ffe14d; outline-offset: -2px; color: #fff; }
  .grid .cell:disabled { opacity: .35; cursor: default; }
  footer { margin-top: 16px; font-size: 12px; color: var(--dim); text-align: center; }
  footer a { color: var(--dim); }
</style>
</head>
<body>

<h1>2D Tennis Simulator — Matchups</h1>
<div class="meta" id="meta"></div>

<div class="gridwrap"><div class="grid" id="grid"></div></div>

<div class="score">
  <div class="side a"><span class="name" id="nameA">A</span><span class="num" id="scoreA">0</span></div>
  <span class="sep">-</span>
  <div class="side b"><span class="name" id="nameB">B</span><span class="num" id="scoreB">0</span></div>
</div>

<canvas id="court"></canvas>

<div class="hud">
  <span id="info">-</span>
  <span class="badge" id="badge">🔥 LONGEST RALLY</span>
</div>

<div class="controls">
  <button id="prev" aria-label="前のカード">⏮</button>
  <button id="play">⏸ PAUSE</button>
  <button id="next" aria-label="次のカード">⏭</button>
  <button id="auto" class="on" aria-label="自動送り">🔁</button>
  <button id="speed">1.0x</button>
</div>

<footer>
  タップで再生/一時停止 ・
  <a href="https://github.com/sashi7446/2DTennisSimulator">GitHub</a>
</footer>

<script src="replays/index.js?v=10909efa"></script>
<script>
(function () {
  const INDEX = window.REPLAY_INDEX;
  const SCHEMA = 1;                     // frame layout this viewer can draw
  const canvas = document.getElementById("court");
  const ctx = canvas.getContext("2d");
  const info = document.getElementById("info");

  if (!INDEX || !INDEX.cards || !INDEX.cards.length) {
    info.textContent = "録画がありません。python record_matrix.py で生成してください。";
    return;
  }
  if (INDEX.version !== SCHEMA) {
    info.textContent = "録画の形式が新しすぎます。ページを再読み込みしてください。";
    return;
  }

  const cards = INDEX.cards;
  const byPair = new Map(cards.map(c => [c.a + "__" + c.b, c]));
  const cardFor = (a, b) => byPair.get(a + "__" + b) || byPair.get(b + "__" + a);

  const PAD = 16;                       // court margin, in field units
  const TRAIL = 14;                     // ball trail length, in frames
  const FLASH = 8;                      // hit flash duration, in frames
  const END_HOLD = 55;                  // frames to hold the winner banner
  const SPEEDS = [1, 2, 0.5];

  let R = null, cardIdx = -1;
  let FW = 0, FH = 0, VW = 1, VH = 1, BALL_R = 0, PLAYER_R = 0, REACH = 0, bestRally = 0;
  let pointIdx = 0, frameIdx = 0, holding = 0, playing = true, speed = 1, speedIdx = 0;
  let auto = true;                      // roll on to the next card at the end

  // --- matchup grid -------------------------------------------------------
  const grid = document.getElementById("grid");
  const agents = INDEX.agents;
  const short = name => name.slice(0, 3).toUpperCase();
  const cells = new Map();

  function buildGrid() {
    grid.style.gridTemplateColumns = `auto repeat(${agents.length}, min-content)`;
    grid.appendChild(document.createElement("div"));
    for (const b of agents) {
      const hd = document.createElement("div");
      hd.className = "hd";
      hd.textContent = short(b);
      grid.appendChild(hd);
    }
    for (const a of agents) {
      const hd = document.createElement("div");
      hd.className = "hd row";
      hd.textContent = short(a);
      grid.appendChild(hd);
      for (const b of agents) {
        const card = cardFor(a, b);
        const cell = document.createElement("button");
        cell.className = "cell" + (card ? " has" : "");
        cell.textContent = a === b ? "=" : "▸";
        cell.title = `${a} vs ${b}`;
        if (!card) {
          cell.disabled = true;
        } else {
          cell.onclick = () => show(cards.indexOf(card));
          const list = cells.get(card.id) || [];
          list.push(cell);
          cells.set(card.id, list);
        }
        grid.appendChild(cell);
      }
    }
  }

  function markGrid() {
    for (const [id, list] of cells) {
      const on = cards[cardIdx] && cards[cardIdx].id === id;
      for (const cell of list) cell.classList.toggle("on", on);
    }
  }

  // --- loading ------------------------------------------------------------
  // Cards are separate files fetched on demand: 28 of them in one bundle
  // would be a megabyte before the first ball is drawn. A <script> tag is
  // used rather than fetch so the page still works over file://.
  const loaded = new Map();
  let pending = null;

  function show(idx) {
    if (idx === cardIdx) return;
    const card = cards[idx];
    cardIdx = idx;
    markGrid();
    document.getElementById("nameA").textContent = card.names[0];
    document.getElementById("nameB").textContent = card.names[1];

    if (loaded.has(card.id)) {
      start(loaded.get(card.id));
      return;
    }

    R = null;
    info.textContent = `${card.a} vs ${card.b} を読み込み中…`;
    pending = card.id;

    const el = document.createElement("script");
    el.src = `replays/${card.file}?v=${card.v}`;
    el.onload = () => {
      const replay = window.REPLAY_CARD;
      window.REPLAY_CARD = null;
      if (!replay) { fail(card); return; }
      loaded.set(card.id, replay);
      if (pending === card.id) start(replay);
    };
    el.onerror = () => fail(card);
    document.head.appendChild(el);
  }

  function fail(card) {
    if (pending !== card.id) return;
    info.textContent = `${card.a} vs ${card.b} を読み込めませんでした`;
  }

  function start(replay) {
    pending = null;
    R = replay;
    [FW, FH] = R.field;
    [BALL_R, PLAYER_R, REACH] = R.radii;
    VW = FW + PAD * 2;
    VH = FH + PAD * 2;
    bestRally = Math.max(...R.points.map(p => p.rally));
    pointIdx = 0; frameIdx = 0; holding = 0;
    if (R.meta) {
      document.getElementById("meta").textContent =
        `${cardIdx + 1}/${cards.length} · ball ${R.meta.ball_speed} · player ${R.meta.player_speed} · reach ${R.meta.reach}`;
    }
    resize();
  }

  // --- layout -------------------------------------------------------------
  let scale = 1;
  function resize() {
    const cssW = canvas.clientWidth;
    const cssH = cssW * VH / VW;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    canvas.style.height = cssH + "px";
    scale = (cssW / VW) * dpr;
  }
  const X = x => (x + PAD) * scale;
  const Y = y => (y + PAD) * scale;
  const S = v => v * scale;

  // --- drawing ------------------------------------------------------------
  function drawCourt() {
    ctx.fillStyle = "#1b212b";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#2f7d55";
    ctx.fillRect(X(0), Y(0), S(FW), S(FH));

    ctx.fillStyle = "#3d9d6b";
    for (const [ax, ay, aw, ah] of R.areas) ctx.fillRect(X(ax), Y(ay), S(aw), S(ah));
    ctx.strokeStyle = "rgba(255,255,255,.65)";
    ctx.lineWidth = Math.max(1, S(2));
    for (const [ax, ay, aw, ah] of R.areas) ctx.strokeRect(X(ax), Y(ay), S(aw), S(ah));

    ctx.strokeStyle = "rgba(255,255,255,.35)";
    ctx.lineWidth = Math.max(1, S(1));
    ctx.beginPath();
    ctx.moveTo(X(FW / 2), Y(0));
    ctx.lineTo(X(FW / 2), Y(FH));
    ctx.stroke();

    ctx.strokeStyle = "rgba(255,255,255,.8)";
    ctx.lineWidth = Math.max(1, S(3));
    ctx.strokeRect(X(0), Y(0), S(FW), S(FH));
  }

  function circle(x, y, r, fill, stroke, width) {
    ctx.beginPath();
    ctx.arc(X(x), Y(y), S(r), 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = Math.max(1, S(width || 1)); ctx.stroke(); }
  }

  function drawFrame() {
    const frames = R.points[pointIdx].f;
    const f = frames[Math.min(frameIdx, frames.length - 1)];

    drawCourt();

    // ball trail
    for (let i = Math.max(0, frameIdx - TRAIL); i < frameIdx; i++) {
      const age = (i - (frameIdx - TRAIL)) / TRAIL;
      ctx.globalAlpha = age * 0.4;
      circle(frames[i][0], frames[i][1], BALL_R * (0.4 + age * 0.6), "#ffe14d");
    }
    ctx.globalAlpha = 1;

    // players
    circle(f[3], f[4], REACH, null, "rgba(255,91,91,.35)", 1);
    circle(f[5], f[6], REACH, null, "rgba(77,139,255,.35)", 1);
    circle(f[3], f[4], PLAYER_R, "#ff5b5b", "rgba(255,255,255,.85)", 2);
    circle(f[5], f[6], PLAYER_R, "#4d8bff", "rgba(255,255,255,.85)", 2);

    // hit flash - an expanding ring where contact happened
    for (let i = Math.max(0, frameIdx - FLASH); i <= frameIdx && i < frames.length; i++) {
      if (!frames[i][7]) continue;
      const age = (frameIdx - i) / FLASH;
      ctx.globalAlpha = 1 - age;
      circle(frames[i][0], frames[i][1], BALL_R + age * 26, null, "#ffffff", 2);
    }
    ctx.globalAlpha = 1;

    // ball - dimmed until it has passed through an in-area
    circle(f[0], f[1], BALL_R, f[2] ? "#ffe14d" : "#9a8f2e", "rgba(0,0,0,.35)", 1);

    if (holding > 0) drawBanner();
  }

  function drawBanner() {
    const p = R.points[pointIdx];
    const text = p.w < 0
      ? "TIME UP"
      : `${R.names[p.w]} WINS  (${p.reason.toUpperCase()})`;
    ctx.font = `700 ${Math.round(S(26))}px -apple-system, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const w = ctx.measureText(text).width + S(28);
    const h = S(46);
    ctx.fillStyle = "rgba(0,0,0,.72)";
    ctx.fillRect(canvas.width / 2 - w / 2, canvas.height / 2 - h / 2, w, h);
    ctx.fillStyle = p.w === 0 ? "#ff8a8a" : p.w === 1 ? "#8fb4ff" : "#e8edf4";
    ctx.fillText(text, canvas.width / 2, canvas.height / 2);
  }

  // --- hud ----------------------------------------------------------------
  function rallyAt(idx) {
    const frames = R.points[pointIdx].f;
    let n = 0;
    for (let i = 0; i <= Math.min(idx, frames.length - 1); i++) if (frames[i][7]) n++;
    return n;
  }

  function updateHud() {
    let a = 0, b = 0;
    for (let i = 0; i < pointIdx; i++) {
      if (R.points[i].w === 0) a++;
      else if (R.points[i].w === 1) b++;
    }
    document.getElementById("scoreA").textContent = a;
    document.getElementById("scoreB").textContent = b;
    info.textContent =
      `Point ${pointIdx + 1}/${R.points.length}   Rally ${rallyAt(frameIdx)}`;
    document.getElementById("badge").classList.toggle(
      "on", R.points[pointIdx].rally >= bestRally && bestRally > 0
    );
  }

  // --- playback -----------------------------------------------------------
  function gotoCard(idx) {
    show((idx + cards.length) % cards.length);
  }

  function advance() {
    if (pointIdx < R.points.length - 1) {
      pointIdx++;
      frameIdx = 0;
      holding = 0;
    } else if (auto) {
      gotoCard(cardIdx + 1);
    } else {
      pointIdx = 0;
      frameIdx = 0;
      holding = 0;
    }
  }

  let acc = 0, last = performance.now();
  function loop(now) {
    const dt = Math.min(now - last, 250);
    last = now;

    if (R) {
      if (playing) {
        acc += dt * (R.fps / 1000) * speed;
        while (acc >= 1 && R) {
          acc -= 1;
          const frames = R.points[pointIdx].f;
          if (frameIdx < frames.length - 1) {
            frameIdx++;
          } else if (holding < END_HOLD) {
            holding++;
          } else {
            advance();
          }
        }
      }
      if (R) {
        drawFrame();
        updateHud();
      }
    }
    requestAnimationFrame(loop);
  }

  // --- controls -----------------------------------------------------------
  const playBtn = document.getElementById("play");
  function setPlaying(v) {
    playing = v;
    playBtn.textContent = playing ? "⏸ PAUSE" : "▶ PLAY";
  }
  playBtn.onclick = () => setPlaying(!playing);
  canvas.onclick = () => setPlaying(!playing);
  document.getElementById("prev").onclick = () => gotoCard(cardIdx - 1);
  document.getElementById("next").onclick = () => gotoCard(cardIdx + 1);
  document.getElementById("speed").onclick = (e) => {
    speedIdx = (speedIdx + 1) % SPEEDS.length;
    speed = SPEEDS[speedIdx];
    e.target.textContent = speed.toFixed(1) + "x";
  };
  const autoBtn = document.getElementById("auto");
  autoBtn.onclick = () => {
    auto = !auto;
    autoBtn.classList.toggle("on", auto);
  };

  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", resize);

  buildGrid();
  resize();
  show(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
